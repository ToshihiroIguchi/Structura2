name: Deploy ShinyLive App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one active deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install ShinyLive R Package
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The app packages must be installed on the runner so that shinylive::export() bundles
          # them into the site (served from GitHub Pages) instead of leaving the browser to
          # download each one from repo.r-wasm.org at startup.
          packages: |
            any::shinylive
            any::shiny
            any::shinyjs
            any::DT
            any::rhandsontable
            any::markdown
            any::lavaan
            any::regsem

      - name: Export ShinyLive site
        run: Rscript export_shinylive.R

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
